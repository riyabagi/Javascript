<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <style>
        .className {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1 id="demo">Original Text</h1>
    <p class="className">This text will turn red.</p>

    <button id="btn">Click Me</button>

    <script>
        // Change text inside the h1 element with ID 'demo'
        document.getElementById("demo").innerHTML = "Hello, Riya!";

        // Change text color using class selector
        document.querySelector(".className").style.color = "red";

        // Event listener for button click
        document.getElementById("btn").addEventListener("click", function () {
            alert("Button Clicked!");
        });
    </script>

</body>

</html>
